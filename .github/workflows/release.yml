name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0)'
        required: true
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: aarch64-apple-darwin
            binary_name: baca
            archive_name: baca-macos-arm64.tar.gz

          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: baca
            archive_name: baca-macos-x86_64.tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: baca
            archive_name: baca-linux-x86_64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: baca.exe
            archive_name: baca-windows-x86_64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" package/
          cp -r assets package/ 2>/dev/null || true
          tar -czvf "${{ matrix.archive_name }}" -C package .

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination package/
          if (Test-Path assets) { Copy-Item -Recurse assets package/ }
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive_name }}"

      - name: Generate Checksum
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile "${{ matrix.archive_name }}" SHA256 | findstr -v "hash" | findstr -v "CertUtil" > "${{ matrix.archive_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: "Baca ${{ steps.get_tag.outputs.TAG_NAME }} — Modern Pure Rust E-Book Reader"
          body: |
            ## Baca ${{ steps.get_tag.outputs.TAG_NAME }} 📖
            
            Baca has been completely reimagined and rewritten in **100% Pure Rust** with **Dioxus 0.6**.

            ### 🚀 Key Highlights:
            - **Pure Rust Performance:** Instantaneous startup, ultra-low memory usage (~4.6MB binary), zero JVM/browser bloat.
            - **Modern Editorial Design:** 4 high-contrast and eye-ease themes (AMOLED Dark, Warm Paper, Midnight Slate, Pure Light).
            - **Local-First & Zero-Telemetry:** 100% offline; your books and reading data are stored locally in SQLite with zero network tracking.
            - **Rich Reader Experience:** Table of Contents drawer, customizable typography (font size, font family, line height), reading progress persistence.

            ### 📦 Binaries Included:
            - macOS Apple Silicon (`aarch64-apple-darwin`)
            - macOS Intel (`x86_64-apple-darwin`)
            - Linux x86_64 (`x86_64-unknown-linux-gnu`)
            - Windows x86_64 (`x86_64-pc-windows-msvc`)
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
